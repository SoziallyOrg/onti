services:
  db:
    image: postgres:16-alpine
    container_name: onti-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-onti}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-onti}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-onti} -d ${POSTGRES_DB:-onti}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  app:
    build:
      context: ..
      dockerfile: ops/Dockerfile
    container_name: onti-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-onti}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-onti}?schema=public
      AUTH_SECRET: ${AUTH_SECRET}
      NEXTAUTH_SECRET: ${AUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-https://localhost}
      PHOTOS_DIR: /app/photos
    volumes:
      - photos:/app/photos
    networks:
      - internal
      - web

  caddy:
    image: caddy:2-alpine
    container_name: onti-caddy
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web

volumes:
  pgdata:
  photos:
  caddy_data:
  caddy_config:

networks:
  internal:
  web:
