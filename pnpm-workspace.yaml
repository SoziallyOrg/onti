# pnpm 11+ reads workspace-level settings from this file.
# Used here only to whitelist post-install scripts that we trust.
onlyBuiltDependencies:
  - sharp
  - unrs-resolver

# Don't auto-run `pnpm install` before every script invocation.
# Useful in CI and lightweight `pnpm typecheck` / `pnpm lint` calls.
verifyDepsBeforeRun: false
